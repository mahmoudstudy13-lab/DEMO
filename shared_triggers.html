<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area 56 · Shared triggers — SAS VA Data-Driven Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* ════════════════════════════════════════════════════════════════
   *  SAS VA DDC MESSAGING SHIM
   *  Self-contained equivalent of util/messagingUtil.js so this file
   *  drops into VA as a single .html with no sibling JS dependencies.
   * ════════════════════════════════════════════════════════════════ */
  (function () {
    if (window.va && window.va.messagingUtil) return;
    window.va = window.va || {};
    var _cb = null;
    window.va.messagingUtil = {
      setOnDataReceivedCallback: function (fn) {
        _cb = fn;
        window.addEventListener('message', function (ev) {
          if (ev && ev.data && typeof ev.data === 'object' && _cb) _cb(ev.data);
        });
      },
      postMessage: function (msg) { if (window.parent) window.parent.postMessage(msg, '*'); },
      postSelectionMessage: function (resultName, rows) {
        rows = (rows || []).map(function (r) { return (typeof r === 'object') ? r : { row: r }; });
        this.postMessage({ resultName: resultName, selections: rows });
      },
      postInstructionalMessage: function (resultName, txt) {
        this.postMessage({ resultName: resultName, message: txt });
      }
    };
  })();
</script>
<style>
  :root {
    --card:#151918; --deep:#0f1413;
    --line:#1c463b; --line-2:#173a30; --hair:rgba(238,248,242,.07); --hair-2:rgba(238,248,242,.045);
    --mint:#2fe3a0; --mint-2:#01c18d; --mint-dim:#0e604a; --mint-bg:#0f2a22; --mint-bg-2:#0f3a2e;
    --purple:#8769a6; --grey:#515d59; --gold:#c5a54a; --gold-dim:#5f542c;
    --teal:#2ab5ad; --red:#c45454; --orange:#ff8f3c; --silver:#b3bcb9;
    --t1:#eef5f1; --t2:#cfdad4; --t3:#8fa199; --t4:#65756e; --t5:#4a5852;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  /* Transparent so the card frame drawn in the page wireframe shows through.
     If VA renders the object on white, set the object's style background to
     transparent (Options → Style) or change this to background:#151918. */
  html, body { width:100%; height:100%; background:transparent; color:var(--t2);
    font-family:'Manrope',-apple-system,system-ui,sans-serif; font-feature-settings:'tnum' 1,'lnum' 1; overflow:hidden;
    -webkit-font-smoothing:antialiased; }
  html { font-size:clamp(10px, 1.25vh + .3vw, 15px); }
  a { color:inherit; text-decoration:none; } button, input, select { font:inherit; color:inherit; background:none; border:0; } button { cursor:pointer; }
  .stage { height:100%; display:flex; flex-direction:column; min-height:0; }
  .lab { font-size:.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--t4); }
  .title { font-size:1.2rem; font-weight:700; color:var(--t1); }
  .sub { font-size:.86rem; color:var(--t3); margin-top:.15rem; }
  .note { font-size:.8rem; color:var(--t3); }
  .link { font-size:.86rem; font-weight:700; color:var(--mint); white-space:nowrap; }
  .head { display:flex; justify-content:space-between; align-items:flex-start; flex-shrink:0; }
  .mint { color:var(--mint); } .purple { color:var(--purple); } .dim { color:var(--t3); }
  .pill { display:inline-flex; align-items:center; gap:.45rem; height:1.7rem; padding:0 .8rem; border-radius:99rem; border:1px solid var(--hair); font-size:.86rem; color:var(--t2); white-space:nowrap; }
  .pill.mint { background:var(--mint-bg); border-color:#1c6a50; color:var(--mint); }
  .pill.purple { background:rgba(135,105,166,.14); border-color:#5b4a73; color:#b9a3d6; }
  .pill.out { color:var(--t3); border-color:#3a4744; }
  .pill.gold { border-color:var(--gold-dim); color:var(--gold); background:rgba(197,165,74,.04); }
  .pill.lab { font-size:.56rem; font-weight:700; letter-spacing:.14em; color:var(--t3); border-color:#3a4744; }
  .pill .dot { width:.5rem; height:.5rem; border-radius:50%; background:currentColor; flex:none; }
  .legend { display:flex; gap:1.2rem; font-size:.8rem; color:var(--t3); }
  .legend span { display:flex; align-items:center; gap:.45rem; }
  .legend i { width:.62rem; height:.62rem; border-radius:50%; background:var(--mint-2); }
  .legend i.f { background:var(--purple); } .legend i.o { background:none; border:1px solid #6a7773; }
  .sample { position:absolute; right:.6rem; top:.4rem; font-size:.6rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold-dim); border-radius:99rem; padding:.2rem .6rem; opacity:.85; z-index:9; }
  .sample.hidden { display:none; }
  .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.9rem; color:var(--t4); text-align:center; padding:0 10%; }

  .stage { padding:1rem 1.3rem 1rem; }
  .rows { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:space-evenly; margin-top:.3rem; }
  .r { display:grid; grid-template-columns:1fr 36% 5.5rem; align-items:center; gap:1.5rem; cursor:pointer; }
  .r:hover .t { color:var(--t1); } .r.on .t { color:var(--gold); }
  .t { display:flex; align-items:center; gap:.5rem; font-size:.95rem; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t svg { width:.8rem; height:.85rem; flex:none; }
  .bar { height:.4rem; border-radius:.2rem; background:#2a2c28; overflow:hidden; } .bar i { display:block; height:100%; background:var(--gold); border-radius:.2rem; }
  .c { font-size:.86rem; font-weight:600; color:var(--t3); text-align:right; white-space:nowrap; }

</style>
</head>
<body>
<span class="sample" id="sample">Sample · awaiting SAS VA</span>
<div class="stage">
<div class="head"><div class="title">Most shared triggers</div><a class="link" href="#" onclick="return false">All triggers →</a></div><div class="rows" id="rows"></div>
</div>
<script>

  'use strict';
  let RESULT_NAME = null, IS_SAMPLE = true;
  const LIFE = { active:'Currently Activated', future:'Expected in the Future', out:'Out of Scope' };
  const LIFE_CLS = { active:'', future:'f', out:'o' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const byId = id => document.getElementById(id);
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';
  const BOLT = '<svg viewBox="0 0 24 24" fill="#e9c75a"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>';
  const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5c.9 5.6 4.9 9.6 10.5 10.5C16.9 12.9 12.9 16.9 12 22.5 11.1 16.9 7.1 12.9 1.5 12 7.1 11.1 11.1 7.1 12 1.5z"/></svg>';
  // Lifecycle values may arrive as codes or labels, in any case
  function normLife(v) { v = String(v || '').toLowerCase();
    if (v.startsWith('act') || v.includes('current')) return 'active';
    if (v.startsWith('fut') || v.includes('expect')) return 'future';
    if (v.startsWith('out')) return 'out'; return 'active'; }
  /* Case-insensitive name/label → column-index map; missing required roles are
     reported back to the VA report author via an instructional message. */
  function mapColumns(msg, required, label) {
    const idx = {};
    msg.columns.forEach((c, i) => { if (c && c.name) idx[String(c.name).toLowerCase()] = i; if (c && c.label) idx[String(c.label).toLowerCase()] = i; });
    const missing = required.filter(k => !(k in idx));
    if (missing.length) { va.messagingUtil.postInstructionalMessage(RESULT_NAME, label + ': please assign the following columns in the Roles tab — ' + missing.join(', ')); return null; }
    return idx;
  }
  function rowsToObjects(msg, idx, cols) { return msg.data.map((row, ri) => { const r = { _row: ri }; cols.forEach(k => { r[k] = k in idx ? row[idx[k]] : undefined; }); return r; }); }
  function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function gotData() { IS_SAMPLE = false; const b = byId('sample'); if (b) b.classList.add('hidden'); }
  function select(rows) { if (RESULT_NAME) va.messagingUtil.postSelectionMessage(RESULT_NAME, rows); }

  /* ════════════════════════════════════════════════════════════════
   *  ROLES (Data tab): TRIGGER, COUNT (optional)
   * ════════════════════════════════════════════════════════════════ */
  const REQUIRED = ["TRIGGER", "COUNT (optional)"];

  /* TRIGGER + optional COUNT; rows are aggregated and the top MAX_ROWS shown. Click selects a trigger's rows. */
  const MAX_ROWS = 5; let ITEMS = [], ON = '';
  function render() { const max = Math.max(...ITEMS.map(t => t.v), 1);
    byId('rows').innerHTML = ITEMS.slice(0, MAX_ROWS).map(t => `<div class="r${ON === t.k ? ' on' : ''}" data-k="${esc(t.k)}"><span class="t">${BOLT}${esc(t.k)}</span><span class="bar"><i style="width:${t.v / max * 100}%"></i></span><span class="c">${t.v} use cases</span></div>`).join(''); }
  function onVADataReceived(msg) {
    if (!msg || !Array.isArray(msg.data) || !Array.isArray(msg.columns)) return;
    RESULT_NAME = msg.resultName;
    const idx = mapColumns(msg, ['trigger'], 'Shared triggers'); if (!idx) return;
    const agg = new Map();
    msg.data.forEach((r, ri) => { const k = String(r[idx.trigger] || '(missing)'); if (!agg.has(k)) agg.set(k, { k, v:0, rows:[] }); const e = agg.get(k); e.v += 'count' in idx ? num(r[idx.count]) : 1; e.rows.push(ri); });
    ITEMS = [...agg.values()].sort((a, b) => b.v - a.v); gotData(); ON = ''; render();
  }
  byId('rows').addEventListener('click', e => { const r = e.target.closest('.r'); if (!r) return; ON = ON === r.dataset.k ? '' : r.dataset.k; select(ON ? ITEMS.find(t => t.k === ON).rows : []); render(); });
  /* ─── Sample data: shown when opened outside SAS VA, replaced by the first VA message ─── */
  function loadSampleData() {
    ITEMS = [{"k": "Spike in citizen reports", "v": 11, "rows": []}, {"k": "Intelligence lead received", "v": 9, "rows": []}, {"k": "Repeat incident at a location", "v": 8, "rows": []}, {"k": "External agency notification", "v": 7, "rows": []}, {"k": "Major event scheduled", "v": 5, "rows": []}]; render();
  }
  va.messagingUtil.setOnDataReceivedCallback(onVADataReceived);
  loadSampleData();
</script>
</body>
</html>
