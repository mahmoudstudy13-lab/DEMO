<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share Bars DDC</title>
<style>
  :root{
    --track:#ececec;
    --bar-top:#12cf92;
    --bar-bottom:#16a06d;
    --value:#1f1f1f;
    --label:#9a9a9a;
    --radius:14px;
    --gap:4%;
  }
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:transparent !important;
    font-family:"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  }
  #chart{display:flex;height:100%;box-sizing:border-box;padding:8px 6px;gap:var(--gap);}
  #chart.rtl{flex-direction:row-reverse;}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;}
  .val{font-weight:700;font-size:clamp(11px,2.4vw,16px);color:var(--value);margin-bottom:8px;direction:ltr;}
  .track{flex:1;width:100%;max-width:120px;background:var(--track);border-radius:var(--radius);position:relative;overflow:hidden;}
  .bar{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:var(--radius);
       background:linear-gradient(180deg,var(--bar-top),var(--bar-bottom));transition:height .6s ease,background .3s;}
  .lbl{margin-top:8px;font-size:clamp(10px,2.2vw,15px);color:var(--label);text-align:center;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .msg{margin:auto;color:var(--label);font-size:13px;text-align:center;}

  /* ---- Color picker (viewer option) ---- */
  #pickerBtn{position:fixed;top:4px;left:4px;width:22px;height:22px;border-radius:50%;
    border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0;opacity:0;transition:opacity .2s;
    background:conic-gradient(#12cf92,#3b82f6,#8b5cf6,#ef4444,#f59e0b,#12cf92);}
  body:hover #pickerBtn,#pickerBtn.open{opacity:.9;}
  #picker{position:fixed;top:30px;left:4px;display:none;gap:6px;flex-wrap:wrap;max-width:170px;
    background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:10;}
  #picker.show{display:flex;}
  .sw{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
  .sw.active{border-color:#333;}
  #customColor{width:22px;height:22px;padding:0;border:none;background:none;cursor:pointer;}
</style>
</head>
<body>
<div id="chart"></div>
<button id="pickerBtn" title="Change color" aria-label="Change color"></button>
<div id="picker"></div>

<script>
/* ===== Settings (can be overridden from the URL, see below) ===== */
const CONFIG = {
  mode: "share",   // "share" = % of total | "value" = raw measure
  decimals: 1,
  sort: "desc",    // "desc" | "asc" | "none"
  rtl: false,
  maxBars: 12,
  picker: true     // show the color button to report viewers
};

/* Preset themes: [top, bottom] gradient colors */
const THEMES = {
  green:  ["#12cf92","#16a06d"],
  blue:   ["#4f9cf9","#1d5fd1"],
  purple: ["#a78bfa","#6d28d9"],
  red:    ["#f87171","#c81e1e"],
  orange: ["#fbbf24","#d97706"],
  teal:   ["#2dd4bf","#0f766e"],
  gold:   ["#d6b56d","#9c7a2e"],
  grey:   ["#9ca3af","#4b5563"]
};

/* ===== URL parameters (designer option) =====
   Example URL in VA:  .../sas_va_ddc_share_bars.html?theme=blue
   or custom:          ...?color=ff6600            (single color, gradient auto-darkened)
                       ...?top=ff9900&bottom=cc5500&track=f2f2f2&value=222222&label=888888
   other:              ...?mode=value&decimals=0&sort=none&rtl=1&picker=0
*/
const P = new URLSearchParams(location.search);
const hex = v => v ? (v.startsWith("#") ? v : "#" + v) : null;
if (P.get("mode")) CONFIG.mode = P.get("mode");
if (P.get("decimals")) CONFIG.decimals = +P.get("decimals");
if (P.get("sort")) CONFIG.sort = P.get("sort");
if (P.get("rtl")) CONFIG.rtl = P.get("rtl") === "1";
if (P.get("picker")) CONFIG.picker = P.get("picker") !== "0";

const root = document.documentElement.style;

function darken(h, f=0.25){
  const n = parseInt(h.slice(1),16);
  const c = s => Math.max(0, Math.round(((n>>s)&255)*(1-f))).toString(16).padStart(2,"0");
  return "#" + c(16) + c(8) + c(0);
}
function applyColors(top, bottom){
  root.setProperty("--bar-top", top);
  root.setProperty("--bar-bottom", bottom || darken(top));
}

// Designer defaults from URL
if (P.get("theme") && THEMES[P.get("theme")]) applyColors(...THEMES[P.get("theme")]);
if (P.get("color")) applyColors(hex(P.get("color")));
if (P.get("top")) applyColors(hex(P.get("top")), hex(P.get("bottom")));
["track","value","label"].forEach(k => { if (P.get(k)) root.setProperty("--"+k, hex(P.get(k))); });

// Viewer's own choice (remembered in their browser only)
const STORE_KEY = "ddcShareBarsColor";
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && CONFIG.picker) applyColors(saved[0], saved[1]);
} catch(e){}

/* ===== Color picker UI ===== */
const btn = document.getElementById("pickerBtn");
const pk = document.getElementById("picker");
function choose(top, bottom, el){
  applyColors(top, bottom);
  try { localStorage.setItem(STORE_KEY, JSON.stringify([top, bottom || darken(top)])); } catch(e){}
  pk.querySelectorAll(".sw").forEach(s => s.classList.remove("active"));
  if (el) el.classList.add("active");
}
if (CONFIG.picker){
  Object.entries(THEMES).forEach(([name,[t,b]])=>{
    const s = document.createElement("div");
    s.className = "sw"; s.title = name;
    s.style.background = `linear-gradient(180deg,${t},${b})`;
    s.onclick = () => choose(t, b, s);
    pk.appendChild(s);
  });
  const custom = document.createElement("input");
  custom.type = "color"; custom.id = "customColor"; custom.title = "Custom color";
  custom.oninput = e => choose(e.target.value);
  pk.appendChild(custom);
  btn.onclick = e => { e.stopPropagation(); pk.classList.toggle("show"); btn.classList.toggle("open"); };
  document.addEventListener("click", e => { if (!pk.contains(e.target)) { pk.classList.remove("show"); btn.classList.remove("open"); } });
} else {
  btn.remove(); pk.remove();
}

/* ===== Chart ===== */
const chart = document.getElementById("chart");
if (CONFIG.rtl) chart.classList.add("rtl");

function showMsg(t){ chart.innerHTML = ""; const d=document.createElement("div"); d.className="msg"; d.textContent=t; chart.appendChild(d); }

function render(rows){
  rows = rows.filter(r => r.val != null && !isNaN(r.val));
  if (!rows.length){ showMsg("No data"); return; }
  if (CONFIG.sort === "desc") rows.sort((a,b)=>b.val-a.val);
  if (CONFIG.sort === "asc")  rows.sort((a,b)=>a.val-b.val);
  rows = rows.slice(0, CONFIG.maxBars);

  const total = rows.reduce((s,r)=>s+r.val,0);
  const shown = rows.map(r => CONFIG.mode === "share" ? (total ? r.val/total*100 : 0) : r.val);
  const max = Math.max(...shown.map(Math.abs)) || 1;

  chart.innerHTML = "";
  rows.forEach((r,i)=>{
    const col = document.createElement("div"); col.className = "col";
    const val = document.createElement("div"); val.className = "val";
    val.textContent = CONFIG.mode === "share"
      ? shown[i].toFixed(CONFIG.decimals) + "%"
      : shown[i].toLocaleString(undefined,{maximumFractionDigits:CONFIG.decimals});
    const track = document.createElement("div"); track.className = "track";
    const bar = document.createElement("div"); bar.className = "bar";
    track.appendChild(bar);
    const lbl = document.createElement("div"); lbl.className = "lbl";
    lbl.textContent = r.cat; lbl.title = r.cat;
    col.append(val, track, lbl);
    chart.appendChild(col);
    requestAnimationFrame(()=>{ bar.style.height = (Math.abs(shown[i])/max*100) + "%"; });
  });
}

/* ===== Receive data from SAS Visual Analytics ===== */
window.addEventListener("message", function(e){
  const r = e.data;
  if (!r || !Array.isArray(r.columns) || !Array.isArray(r.data)) return;
  const ci = r.columns.findIndex(c => c.type === "string");
  const mi = r.columns.findIndex(c => c.type === "number");
  if (ci < 0 || mi < 0){ showMsg("Assign 1 category and 1 measure"); return; }
  render(r.data.map(row => ({ cat: String(row[ci] ?? ""), val: Number(row[mi]) })));
}, false);

/* ===== Demo data outside VA ===== */
if (window.parent === window){
  render([
    {cat:"عدد المركبات", val:40.2},
    {cat:"السوابق الجنائية", val:28.1},
    {cat:"الجنسية", val:15.3},
    {cat:"الوظيفة", val:10.1},
    {cat:"صنف المركبة", val:6.3}
  ]);
} else {
  showMsg("Assign 1 category and 1 measure");
}
</script>
</body>
</html>
