<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Bars DDC</title>
<style>
  :root{
    --track:#eeeeee;      /* grey full-length track */
    --bar:#f0a35e;        /* bar color */
    --value:#1f1f1f;      /* value label */
    --label:#4a4a4a;      /* category label */
    --ref:#3a3a3a;        /* reference line */
    --radius:2px;
    --label-width:34%;
    --row-min:26px;       /* minimum row height before scrolling starts */
  }
  html,body{
    margin:0;height:100%;overflow:hidden;background:transparent !important;
    font-family:"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  }
  #chart{height:100%;box-sizing:border-box;padding:6px 8px;display:flex;flex-direction:column;gap:6px;
         overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#c8c8c8 transparent;}
  #chart.noscroll{overflow-y:hidden;gap:2px;}
  /* auto margins centre the rows when they fit, and collapse to 0 when they overflow (so the top row stays reachable) */
  #chart > .row:first-of-type{margin-top:auto;}
  #chart > .row:last-of-type{margin-bottom:auto;}
  .row{flex:1 0 var(--row-min);max-height:34px;min-height:var(--row-min);display:flex;align-items:center;gap:10px;}
  #chart.noscroll .row{flex:1 1 0;min-height:6px;}
  #chart.noscroll .track{margin:1px 0;}
  #chart::-webkit-scrollbar{width:6px;}
  #chart::-webkit-scrollbar-thumb{background:#c8c8c8;border-radius:3px;}
  #chart::-webkit-scrollbar-track{background:transparent;}
  .lbl{flex:0 0 var(--label-width);font-size:clamp(10px,2vw,14px);font-weight:600;color:var(--label);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track{flex:1;align-self:stretch;margin:3px 0;background:var(--track);border-radius:var(--radius);position:relative;}
  .bar{position:absolute;top:22%;bottom:22%;inset-inline-start:0;width:0;background:var(--bar);
       border-radius:var(--radius);transition:width .6s ease;}
  .val{position:absolute;top:50%;transform:translateY(-50%);font-weight:700;font-size:clamp(10px,1.9vw,13px);
       color:var(--value);white-space:nowrap;direction:ltr;padding-inline:6px;}
  .ref{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--ref);}
  .msg{margin:auto;color:#9a9a9a;font-size:13px;text-align:center;}
</style>
</head>
<body>
<div id="chart"></div>

<script>
/* ===================== URL OPTIONS (developer only) =====================
   RANKING
     ?rank=top&n=5        show the 5 highest values
     ?rank=bottom&n=10    show the 10 lowest values
     (no rank)            show all rows

   SORTING (applied after ranking)
     ?sort=desc           highest first
     ?sort=asc            lowest first
     ?sort=label          by category name A→Z   (?sort=label_desc for Z→A)
     ?sort=none           keep the order sent by VA
     default: desc when rank=top, asc when rank=bottom, otherwise none

   AXIS / REFERENCE LINE
     ?min=0&max=100       axis range (default 0 → 100, or auto if values exceed 100)
     ?ref=87              fixed reference line;  ?ref=avg  = average of shown values
                          (or assign a 2nd measure in VA as a per-row target)

   COLORS (hex, with or without #)
     ?color=f0a35e  ?track=eeeeee  ?value=1f1f1f  ?label=4a4a4a  ?refcolor=3a3a3a

   SCROLLING
     (default)            a thin vertical scroll bar appears only when rows don't fit
     ?rowheight=30        minimum row height in px before scrolling starts (default 26)
     ?scroll=0            no scroll bar: squeeze all rows to fit the object height

   OTHER
     ?rtl=0               left-to-right layout (default right-to-left)
     ?decimals=1          decimals in value labels

   Example:
     sas_va_ddc_hbar_track.html?rank=top&n=5&sort=desc&color=1d5fd1&ref=avg
========================================================================== */
/* Options are read (in this priority) from:
   1) VA report parameters named rank / n / sort (if your VA release sends parameters to DDC)
   2) the URL hash   e.g.  page.html#rank=top&n=5
   3) the URL query  e.g.  page.html?rank=top&n=5
   Keys are case-insensitive. Add ?debug=1 to show what the page received. */
const lowerKeys = sp => { const m = new Map(); sp.forEach((v,k)=>m.set(k.trim().toLowerCase(), v.trim())); return m; };
const URLOPTS = lowerKeys(new URLSearchParams(location.search));
lowerKeys(new URLSearchParams(location.hash.replace(/^#/, ""))).forEach((v,k)=>URLOPTS.set(k,v));
let VAOPTS = new Map();
const get = k => VAOPTS.has(k) ? VAOPTS.get(k) : (URLOPTS.has(k) ? URLOPTS.get(k) : null);
const P = { get };
const hex = v => v ? (v.startsWith("#") ? v : "#" + v) : null;
const num = (k, d) => { const v = get(k); return (v != null && v !== "" && !isNaN(+v)) ? +v : d; };

const CONFIG = {};
function readConfig(){
  const rank = String(get("rank") || "").toLowerCase();
  CONFIG.rtl = get("rtl") !== "0";
  CONFIG.min = num("min", 0);
  CONFIG.max = num("max", null);
  CONFIG.ref = get("ref");
  CONFIG.decimals = num("decimals", 1);
  CONFIG.rank = (rank === "top" || rank === "bottom") ? rank : null;
  CONFIG.n = Math.max(1, Math.floor(num("n", 5)));
  CONFIG.sort = String(get("sort") || (rank === "top" ? "desc" : rank === "bottom" ? "asc" : "none")).toLowerCase();
  CONFIG.debug = get("debug") === "1";
}
readConfig();

/* Pick up VA report parameters if they are included in the DDC message */
function readVaParameters(msg){
  if (!msg || !Array.isArray(msg.parameters)) return;
  const m = new Map();
  msg.parameters.forEach(p => {
    const key = String(p.label || p.name || "").trim().toLowerCase();
    let v = p.value;
    if (Array.isArray(v)) v = v[0];
    if (v && typeof v === "object") v = v.value ?? v.formattedValue;
    if (["rank","n","sort"].includes(key) && v != null && v !== "") m.set(key, String(v).trim());
  });
  VAOPTS = m;
  readConfig();
}

const root = document.documentElement.style;
[["color","--bar"],["track","--track"],["value","--value"],["label","--label"],["refcolor","--ref"]]
  .forEach(([k,v]) => { if (P.get(k)) root.setProperty(v, hex(P.get(k))); });

const chart = document.getElementById("chart");
chart.dir = CONFIG.rtl ? "rtl" : "ltr";
if (get("scroll") === "0") chart.classList.add("noscroll");
if (num("rowheight", null)) root.setProperty("--row-min", Math.max(12, num("rowheight", 26)) + "px");

function showMsg(t){ chart.innerHTML=""; const d=document.createElement("div"); d.className="msg"; d.textContent=t; chart.appendChild(d); }
const fmt = v => Number(v).toLocaleString("en-US",{minimumFractionDigits:CONFIG.decimals,maximumFractionDigits:CONFIG.decimals});

function applyRankAndSort(rows){
  // 1) ranking: pick highest / lowest N
  if (CONFIG.rank === "top")    rows = rows.slice().sort((a,b)=>b.val-a.val).slice(0, CONFIG.n);
  if (CONFIG.rank === "bottom") rows = rows.slice().sort((a,b)=>a.val-b.val).slice(0, CONFIG.n);
  // 2) display order
  const byLabel = (a,b)=>a.cat.localeCompare(b.cat, "ar");
  switch (CONFIG.sort){
    case "desc":       rows.sort((a,b)=>b.val-a.val); break;
    case "asc":        rows.sort((a,b)=>a.val-b.val); break;
    case "label":      rows.sort(byLabel); break;
    case "label_desc": rows.sort((a,b)=>byLabel(b,a)); break;
  }
  return rows;
}

function render(rows){
  rows = rows.filter(r => r.val != null && !isNaN(r.val));
  if (!rows.length){ showMsg("No data"); return; }
  const received = rows.length;
  rows = applyRankAndSort(rows);

  const vals = rows.map(r=>r.val);
  let globalRef = null;
  if (CONFIG.ref === "avg") globalRef = vals.reduce((a,b)=>a+b,0)/vals.length;
  else if (CONFIG.ref != null && !isNaN(+CONFIG.ref)) globalRef = +CONFIG.ref;

  const tops = vals.concat(rows.map(r=>r.ref).filter(v=>v!=null&&!isNaN(v)), globalRef!=null?[globalRef]:[]);
  const hi = Math.max(...tops);
  const max = CONFIG.max != null ? CONFIG.max : (hi <= 100 ? 100 : hi * 1.1);
  const min = CONFIG.min;
  const pct = v => Math.max(0, Math.min(100, (v - min) / ((max - min) || 1) * 100));

  chart.innerHTML = "";
  chart.scrollTop = 0;
  rows.forEach(r=>{
    const row=document.createElement("div"); row.className="row";
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=r.cat; lbl.title=r.cat;
    const track=document.createElement("div"); track.className="track";
    const bar=document.createElement("div"); bar.className="bar";
    const val=document.createElement("div"); val.className="val"; val.textContent=fmt(r.val);
    const p = pct(r.val);
    if (p > 88){ val.style.insetInlineEnd = (100 - p) + "%"; val.style.color = "#fff"; }
    else { val.style.insetInlineStart = p + "%"; }
    track.append(bar, val);

    const refVal = (r.ref != null && !isNaN(r.ref)) ? r.ref : globalRef;
    if (refVal != null){
      const ref=document.createElement("div"); ref.className="ref";
      ref.style.insetInlineStart = pct(refVal) + "%";
      ref.title = "Reference: " + fmt(refVal);
      track.appendChild(ref);
    }
    row.append(lbl, track);
    chart.appendChild(row);
    requestAnimationFrame(()=>{ bar.style.width = p + "%"; });
  });

  if (CONFIG.debug){
    const d=document.createElement("div");
    d.style.cssText="position:fixed;bottom:2px;left:4px;font:11px/1.3 monospace;color:#c00;background:#fff;direction:ltr;padding:2px 4px;border:1px solid #c00;z-index:9";
    d.textContent=`v2 | rank=${CONFIG.rank} n=${CONFIG.n} sort=${CONFIG.sort} | rows received=${received} shown=${rows.length} | url=${location.search}${location.hash} | va params=${[...VAOPTS].map(x=>x.join("=")).join(",")||"none"}`;
    chart.appendChild(d);
  }
}

/* ===== Data from SAS Visual Analytics =====
   Roles: 1 category (required), 1st measure = value (required), 2nd measure = target (optional) */
window.addEventListener("message", function(e){
  const r = e.data;
  if (!r || !Array.isArray(r.columns) || !Array.isArray(r.data)) return;
  readVaParameters(r);
  const ci = r.columns.findIndex(c => c.type === "string");
  const nums = r.columns.map((c,i)=>c.type==="number"?i:-1).filter(i=>i>=0);
  if (ci < 0 || !nums.length){ showMsg("Assign 1 category and 1 measure"); return; }
  render(r.data.map(row => ({
    cat: String(row[ci] ?? ""),
    val: Number(row[nums[0]]),
    ref: nums[1] != null ? Number(row[nums[1]]) : null
  })));
}, false);

/* ===== Demo outside VA ===== */
if (window.parent === window){
  if (!URLOPTS.has("ref")) { URLOPTS.set("ref","87"); readConfig(); }
  render([
    {cat:"دائرة الموارد البشرية الحكومية", val:52.2},
    {cat:"دائرة الاقتصاد والسياحة", val:56.8},
    {cat:"المجلس الأعلى للطاقة", val:56.8},
    {cat:"الإقامة وشؤون الأجانب", val:57.1},
    {cat:"دائرة التعليم", val:61.4},
    {cat:"دائرة الصحة", val:48.9}
  ]);
} else {
  showMsg("Assign 1 category and 1 measure");
}
</script>
</body>
</html>
