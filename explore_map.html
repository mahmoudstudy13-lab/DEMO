<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area 56 · Explore map — SAS VA Data-Driven Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* ════════════════════════════════════════════════════════════════
   *  SAS VA DDC MESSAGING SHIM
   *  Self-contained equivalent of util/messagingUtil.js so this file
   *  drops into VA as a single .html with no sibling JS dependencies.
   * ════════════════════════════════════════════════════════════════ */
  (function () {
    if (window.va && window.va.messagingUtil) return;
    window.va = window.va || {};
    var _cb = null;
    window.va.messagingUtil = {
      setOnDataReceivedCallback: function (fn) {
        _cb = fn;
        window.addEventListener('message', function (ev) {
          if (ev && ev.data && typeof ev.data === 'object' && _cb) _cb(ev.data);
        });
      },
      postMessage: function (msg) { if (window.parent) window.parent.postMessage(msg, '*'); },
      postSelectionMessage: function (resultName, rows) {
        rows = (rows || []).map(function (r) { return (typeof r === 'object') ? r : { row: r }; });
        this.postMessage({ resultName: resultName, selections: rows });
      },
      postInstructionalMessage: function (resultName, txt) {
        this.postMessage({ resultName: resultName, message: txt });
      }
    };
  })();
</script>
<style>
  :root {
    --card:#151918; --deep:#0f1413;
    --line:#1c463b; --line-2:#173a30; --hair:rgba(238,248,242,.07); --hair-2:rgba(238,248,242,.045);
    --mint:#2fe3a0; --mint-2:#01c18d; --mint-dim:#0e604a; --mint-bg:#0f2a22; --mint-bg-2:#0f3a2e;
    --purple:#8769a6; --grey:#515d59; --gold:#c5a54a; --gold-dim:#5f542c;
    --teal:#2ab5ad; --red:#c45454; --orange:#ff8f3c; --silver:#b3bcb9;
    --t1:#eef5f1; --t2:#cfdad4; --t3:#8fa199; --t4:#65756e; --t5:#4a5852;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  /* Transparent so the card frame drawn in the page wireframe shows through.
     If VA renders the object on white, set the object's style background to
     transparent (Options → Style) or change this to background:#151918. */
  html, body { width:100%; height:100%; background:transparent; color:var(--t2);
    font-family:'Manrope',-apple-system,system-ui,sans-serif; font-feature-settings:'tnum' 1,'lnum' 1; overflow:hidden;
    -webkit-font-smoothing:antialiased; }
  html { font-size:clamp(10px, 1.25vh + .3vw, 15px); }
  a { color:inherit; text-decoration:none; } button, input, select { font:inherit; color:inherit; background:none; border:0; } button { cursor:pointer; }
  .stage { height:100%; display:flex; flex-direction:column; min-height:0; }
  .lab { font-size:.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--t4); }
  .title { font-size:1.2rem; font-weight:700; color:var(--t1); }
  .sub { font-size:.86rem; color:var(--t3); margin-top:.15rem; }
  .note { font-size:.8rem; color:var(--t3); }
  .link { font-size:.86rem; font-weight:700; color:var(--mint); white-space:nowrap; }
  .head { display:flex; justify-content:space-between; align-items:flex-start; flex-shrink:0; }
  .mint { color:var(--mint); } .purple { color:var(--purple); } .dim { color:var(--t3); }
  .pill { display:inline-flex; align-items:center; gap:.45rem; height:1.7rem; padding:0 .8rem; border-radius:99rem; border:1px solid var(--hair); font-size:.86rem; color:var(--t2); white-space:nowrap; }
  .pill.mint { background:var(--mint-bg); border-color:#1c6a50; color:var(--mint); }
  .pill.purple { background:rgba(135,105,166,.14); border-color:#5b4a73; color:#b9a3d6; }
  .pill.out { color:var(--t3); border-color:#3a4744; }
  .pill.gold { border-color:var(--gold-dim); color:var(--gold); background:rgba(197,165,74,.04); }
  .pill.lab { font-size:.56rem; font-weight:700; letter-spacing:.14em; color:var(--t3); border-color:#3a4744; }
  .pill .dot { width:.5rem; height:.5rem; border-radius:50%; background:currentColor; flex:none; }
  .legend { display:flex; gap:1.2rem; font-size:.8rem; color:var(--t3); }
  .legend span { display:flex; align-items:center; gap:.45rem; }
  .legend i { width:.62rem; height:.62rem; border-radius:50%; background:var(--mint-2); }
  .legend i.f { background:var(--purple); } .legend i.o { background:none; border:1px solid #6a7773; }
  .sample { position:absolute; right:.6rem; top:.4rem; font-size:.6rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold-dim); border-radius:99rem; padding:.2rem .6rem; opacity:.85; z-index:9; }
  .sample.hidden { display:none; }
  .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.9rem; color:var(--t4); text-align:center; padding:0 10%; }

  .stage { padding:1.1rem .7rem .4rem 1.3rem; position:relative; }
  .head { padding-right:.6rem; }
  .filters { display:flex; gap:.45rem; }
  .sel-wrap { position:relative; } .sel { appearance:none; -webkit-appearance:none; height:1.6rem; padding:0 1.6rem 0 .75rem; border:1px solid var(--mint-dim); border-radius:99rem; font-size:.82rem; color:var(--t2); background:rgba(15,42,34,.25); cursor:pointer; outline:0; }
  .sel option { background:#0f1614; } .sel-wrap::after { content:''; position:absolute; right:.65rem; top:50%; transform:translateY(-40%); border-left:.2rem solid transparent; border-right:.2rem solid transparent; border-top:.26rem solid var(--t3); pointer-events:none; }
  .legend { justify-content:flex-end; margin:.2rem .6rem 0 0; }
  .tbl { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; margin-top:.2rem; }
  .row { display:grid; grid-template-columns:3.9rem 16rem 6.5rem 1fr 4rem 4rem 4rem 6.5rem; align-items:center; flex:1; min-height:0; max-height:5rem; border-bottom:1px solid var(--hair-2); position:relative; }
  .row.h { flex:0 0 2rem; border-bottom:0; white-space:nowrap; }
  .row:not(.h):hover { background:rgba(238,248,242,.025); }
  .dep { width:2.6rem; height:1.55rem; border-radius:99rem; background:#162d27; border:1px solid #1a4a3c; color:var(--mint); font-size:.7rem; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .name { font-size:1.02rem; font-weight:500; color:#e6eee9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:.6rem; }
  .cnt { font-size:1.4rem; font-weight:700; color:var(--t1); padding-left:.6rem; }
  .dots { display:flex; gap:.62rem; align-items:center; }
  .dt { width:1.28rem; height:1.28rem; border-radius:50%; background:var(--mint-2); transition:transform .12s, opacity .2s, box-shadow .12s; }
  .dt.f { background:var(--purple); } .dt.o { background:transparent; border:1.5px solid #6a7773; }
  .dt:hover { transform:scale(1.18); box-shadow:0 0 0 .2rem rgba(238,248,242,.14); }
  .dt.sel { box-shadow:0 0 0 .2rem #fff inset; } .dt.o.sel { border-color:#fff; }
  .dt.dim { opacity:.16; pointer-events:none; }
  .n { font-size:.95rem; font-weight:600; text-align:center; }
  .open { font-size:.84rem; font-weight:600; color:var(--t4); text-align:right; padding-right:.9rem; white-space:nowrap; } .open:hover { color:var(--mint); }
  .row.sel { background:#152823; border:1px solid var(--mint-dim); border-radius:.65rem; margin:0 .5rem 0 -.8rem; padding:0 .8rem; }
  .row.sel .name { font-weight:700; color:var(--t1); } .row.sel .open { color:var(--mint); font-weight:700; }
  .tip { position:absolute; width:21rem; background:#0a1512; border:1px solid var(--line); border-radius:.8rem; padding:1rem; z-index:5; box-shadow:0 1.5rem 3.5rem rgba(0,0,0,.55); display:none; }
  .tip.show { display:block; animation:tipin .16s ease-out; } @keyframes tipin { from { opacity:0; transform:translateY(-.25rem); } to { opacity:1; transform:none; } }
  .tip .x { position:absolute; right:.6rem; top:.5rem; color:var(--t4); font-size:1.15rem; line-height:1; padding:.1rem .4rem; } .tip .x:hover { color:var(--t1); }
  .tip .id { font-size:.8rem; font-weight:600; color:var(--t3); } .tip .id em { font-style:normal; color:var(--t4); margin:0 .4rem; }
  .tip h4 { font-size:1.02rem; font-weight:700; color:var(--t1); margin:.4rem 0 .8rem; }
  .tip .chips { display:flex; gap:.5rem; align-items:center; } .tip .rl { font-size:.8rem; color:var(--t3); margin-top:1rem; }
  .tip .rv { display:flex; justify-content:space-between; align-items:flex-end; margin-top:.4rem; } .tip .rv b { font-size:1.4rem; font-weight:800; color:var(--t1); line-height:1; } .tip .rv button { font-size:.84rem; font-weight:700; color:var(--mint); }

</style>
</head>
<body>
<span class="sample" id="sample">Sample · awaiting SAS VA</span>
<div class="stage">
<div class="head">
  <div><div class="title" style="font-size:1.35rem">Explore map</div><div class="sub">Each dot is one Business Use Case · each row is a Department · select a dot to open it</div></div>
  <div class="filters">
    <span class="sel-wrap"><select class="sel" id="f-status"><option value="">Status: All</option><option value="active">Status: Currently Activated</option><option value="future">Status: Expected in the Future</option><option value="out">Status: Out of Scope</option></select></span>
    <span class="sel-wrap"><select class="sel" id="f-phase"><option value="">Phase: All</option><option>PRE</option><option>DURING</option><option>POST</option></select></span>
    <span class="sel-wrap"><select class="sel" id="f-process"><option value="">Process: All</option><option>Analyze</option><option>Alert</option><option>Decide</option><option>Record</option><option>Search</option></select></span>
    <span class="sel-wrap"><select class="sel" id="f-sort"><option value="dept">Sort: Department</option><option value="ucs">Sort: Use cases</option><option value="active">Sort: Active</option></select></span>
  </div>
</div>
<div class="legend"><span><i></i>Currently Activated</span><span><i class="f"></i>Expected in the Future</span><span><i class="o"></i>Out of Scope</span></div>
<div class="tbl" id="tbl">
  <div class="row h"><span class="lab">Department</span><span></span><span class="lab">Use cases</span><span class="lab">Each use case</span><span class="lab" style="grid-column:span 3;white-space:nowrap">Active · Future · Out</span><span></span></div>
  <div id="rows" style="display:contents"></div>
  <div class="tip" id="tip">
    <button class="x" onclick="closeTip()" aria-label="Close">×</button>
    <div class="id"><span id="tipId"></span><em>·</em><span id="tipDep"></span></div>
    <h4 id="tipTitle"></h4>
    <div class="chips"><span class="pill" id="tipStatus"><i class="dot"></i><span></span></span><span class="pill lab" id="tipPhase"></span><span class="pill gold" id="tipProc"></span></div>
    <div class="rl">Ranking score</div>
    <div class="rv"><b id="tipScore"></b><button id="tipOpen">Open use case →</button></div>
  </div>
</div>
</div>
<script>

  'use strict';
  let RESULT_NAME = null, IS_SAMPLE = true;
  const LIFE = { active:'Currently Activated', future:'Expected in the Future', out:'Out of Scope' };
  const LIFE_CLS = { active:'', future:'f', out:'o' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const byId = id => document.getElementById(id);
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';
  const BOLT = '<svg viewBox="0 0 24 24" fill="#e9c75a"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>';
  const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5c.9 5.6 4.9 9.6 10.5 10.5C16.9 12.9 12.9 16.9 12 22.5 11.1 16.9 7.1 12.9 1.5 12 7.1 11.1 11.1 7.1 12 1.5z"/></svg>';
  // Lifecycle values may arrive as codes or labels, in any case
  function normLife(v) { v = String(v || '').toLowerCase();
    if (v.startsWith('act') || v.includes('current')) return 'active';
    if (v.startsWith('fut') || v.includes('expect')) return 'future';
    if (v.startsWith('out')) return 'out'; return 'active'; }
  /* Case-insensitive name/label → column-index map; missing required roles are
     reported back to the VA report author via an instructional message. */
  function mapColumns(msg, required, label) {
    const idx = {};
    msg.columns.forEach((c, i) => { if (c && c.name) idx[String(c.name).toLowerCase()] = i; if (c && c.label) idx[String(c.label).toLowerCase()] = i; });
    const missing = required.filter(k => !(k in idx));
    if (missing.length) { va.messagingUtil.postInstructionalMessage(RESULT_NAME, label + ': please assign the following columns in the Roles tab — ' + missing.join(', ')); return null; }
    return idx;
  }
  function rowsToObjects(msg, idx, cols) { return msg.data.map((row, ri) => { const r = { _row: ri }; cols.forEach(k => { r[k] = k in idx ? row[idx[k]] : undefined; }); return r; }); }
  function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function gotData() { IS_SAMPLE = false; const b = byId('sample'); if (b) b.classList.add('hidden'); }
  function select(rows) { if (RESULT_NAME) va.messagingUtil.postSelectionMessage(RESULT_NAME, rows); }

  /* ════════════════════════════════════════════════════════════════
   *  ROLES (Data tab): UC_ID, DEPT_ID, DEPT_NAME, TITLE, LIFECYCLE, PHASE, PROCESS, SCORE
   * ════════════════════════════════════════════════════════════════ */
  const REQUIRED = ["UC_ID", "DEPT_ID", "DEPT_NAME", "TITLE", "LIFECYCLE", "PHASE", "PROCESS", "SCORE"];

  /* One row per use case. Clicking a dot selects that row in VA (use it in an
     Action to filter / navigate to the Use Case page). "Open list" selects the department's rows. */
  let UCS = [], F = { lifecycle:'', phase:'', process:'', sort:'dept' }, SEL = null;
  const COLS = ['uc_id','dept_id','dept_name','title','lifecycle','phase','process','score'];
  function onVADataReceived(msg) {
    if (!msg || !Array.isArray(msg.data) || !Array.isArray(msg.columns)) return;
    RESULT_NAME = msg.resultName;
    const idx = mapColumns(msg, COLS, 'Explore map'); if (!idx) return;
    UCS = rowsToObjects(msg, idx, COLS).map(u => ({ ...u, lifecycle: normLife(u.lifecycle), phase: String(u.phase || '').toUpperCase(), score: num(u.score) }));
    gotData(); render();
  }
  function render() {
    const vis = new Set(UCS.filter(u => (!F.lifecycle || u.lifecycle === F.lifecycle) && (!F.phase || u.phase === F.phase) && (!F.process || u.process === F.process)).map(u => u._row));
    const map = new Map(); UCS.forEach(u => { if (!map.has(u.dept_id)) map.set(u.dept_id, { id:u.dept_id, name:u.dept_name, ucs:[] }); map.get(u.dept_id).ucs.push(u); });
    const depts = [...map.values()].map(d => ({ ...d, a:d.ucs.filter(u=>u.lifecycle==='active').length, f:d.ucs.filter(u=>u.lifecycle==='future').length, o:d.ucs.filter(u=>u.lifecycle==='out').length }));
    depts.sort((x, y) => F.sort === 'ucs' ? y.ucs.length - x.ucs.length : F.sort === 'active' ? y.a - x.a : String(x.id).localeCompare(String(y.id)));
    const ord = { active:0, future:1, out:2 };
    byId('rows').innerHTML = depts.map(d => `<div class="row" data-dep="${esc(d.id)}">
      <span class="dep">${esc(d.id)}</span><span class="name">${esc(d.name)}</span><span class="cnt">${d.ucs.length}</span>
      <span class="dots">${d.ucs.slice().sort((x, y) => ord[x.lifecycle] - ord[y.lifecycle]).map(u => `<button class="dt ${LIFE_CLS[u.lifecycle]}${vis.has(u._row) ? '' : ' dim'}" data-row="${u._row}" title="${esc(u.uc_id)} · ${esc(u.title)}"></button>`).join('')}</span>
      <span class="n mint">${String(d.a).padStart(2,'0')}</span><span class="n purple">${String(d.f).padStart(2,'0')}</span><span class="n dim">${String(d.o).padStart(2,'0')}</span>
      <button class="open" data-dep="${esc(d.id)}">Open list →</button></div>`).join('');
    closeTip();
  }
  function closeTip() { const t = byId('tip'); t.classList.remove('show'); t.style.display = ''; document.querySelectorAll('.row.sel,.dt.sel').forEach(e => e.classList.remove('sel')); if (SEL !== null) { SEL = null; select([]); } }
  function openTip(dot) {
    const was = dot.classList.contains('sel'); closeTip(); if (was) return;
    const u = UCS.find(x => x._row === +dot.dataset.row), row = dot.closest('.row'), tbl = byId('tbl'), tip = byId('tip');
    row.classList.add('sel'); dot.classList.add('sel'); SEL = u._row; select([u._row]);
    byId('tipId').textContent = u.uc_id; byId('tipDep').textContent = u.dept_name; byId('tipTitle').textContent = u.title;
    const st = byId('tipStatus'); st.className = 'pill ' + ({active:'mint',future:'purple',out:'out'}[u.lifecycle]); st.lastElementChild.textContent = LIFE[u.lifecycle];
    byId('tipPhase').textContent = u.phase; byId('tipProc').textContent = u.process; byId('tipScore').textContent = u.score;
    tip.style.display = 'block';
    tip.style.left = Math.max(0, Math.min(row.offsetLeft + dot.offsetLeft - 12, tbl.clientWidth - tip.offsetWidth - 4)) + 'px';
    const below = row.offsetTop + row.offsetHeight - 4;
    tip.style.top = (below + tip.offsetHeight > tbl.clientHeight ? row.offsetTop - tip.offsetHeight + 4 : below) + 'px';
    tip.classList.add('show');
  }
  byId('tbl').addEventListener('click', e => { const d = e.target.closest('.dt'); if (d) return openTip(d);
    const o = e.target.closest('.open'); if (o) select(UCS.filter(u => String(u.dept_id) === o.dataset.dep).map(u => u._row)); });
  byId('tipOpen').addEventListener('click', () => { if (SEL !== null) select([SEL]); });
  document.addEventListener('click', e => { if (!e.target.closest('#tbl')) closeTip(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTip(); });
  ['status','phase','process','sort'].forEach(k => byId('f-' + k).addEventListener('change', e => { F[k === 'status' ? 'lifecycle' : k] = e.target.value; render(); }));
  window.addEventListener('resize', closeTip);
  /* ─── Sample data: shown when opened outside SAS VA, replaced by the first VA message ─── */
  function loadSampleData() {
